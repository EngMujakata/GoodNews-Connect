<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GoodNews Connect</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1877f2">
<link rel="apple-touch-icon" href="logo.jpg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GoodNews Connect">
<style>
:root{--bg:#f0f2f5;--c:#fff;--t:#1c1e21;--g:#8a8d91;--b:#1877f2;--l:#dddfe2}
[data-d]{--bg:#18191a;--c:#242526;--t:#e4e6eb;--g:#8a8d91;--l:#3a3b3c}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--c);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:5}
header img{height:34px;border-radius:6px}header b{color:var(--b);margin-left:8px}
#main{padding:64px 10px 76px;max-width:640px;margin:auto}
footer{position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--c);border-top:1px solid var(--l);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
footer button{flex:1;background:none;border:0;color:var(--g);position:relative;font-size:10px}footer button.on{color:var(--b)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
.badge{position:absolute;top:4px;left:55%;background:#e41e3f;color:#fff;border-radius:9px;padding:0 5px;font-size:10px}
.card{background:var(--c);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px #0002}
input,select,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
button.p{background:var(--b);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600}button.s{background:var(--bg);color:var(--t);border:1px solid var(--l);border-radius:8px;padding:8px 12px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.av{width:42px;height:42px;border-radius:50%;background:var(--l) center/cover;flex:none}
.tag{background:#e7f3ff;color:var(--b);border-radius:6px;padding:2px 7px;font-size:12px}small,.m{color:var(--g)}
.sk{height:84px;border-radius:10px;margin-bottom:10px;background:linear-gradient(90deg,var(--c) 25%,var(--l) 37%,var(--c) 63%);background-size:400% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;margin:4px 0;background:var(--l)}.msg.me{background:var(--b);color:#fff;margin-left:auto}
.modal{position:fixed;inset:0;background:#0008;z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}.modal>div{background:var(--c);border-radius:12px;padding:16px;max-height:80vh;overflow:auto;white-space:pre-wrap}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:20px;z-index:20;display:none}
.auth{max-width:360px;margin:40px auto;padding:16px;text-align:center}.auth img{width:96px;border-radius:16px}
a{color:var(--b)}h3{margin:6px 0}
</style></head><body>
<div id="toast"></div><div id="app"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxxaoXfdrKSPHHw9EPGLQKx9SYSw0GI-lLhw2bnnBQrbPDtt7tmStWWy-MEZyqGSoHN/exec';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T=localStorage.t,ME=null,V='feed',UN=0,dp;
if(localStorage.d)document.body.dataset.d=1;
const I={up:'<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',feed:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',msg:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6A8 8 0 1121 12z"/></svg>',acc:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>',out:'<svg viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg>'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
async function api(a,d={},r=crypto.randomUUID()){
  for(let i=0;i<2;i++)try{const x=await(await fetch(API,{method:'POST',body:JSON.stringify({a,t:T,rid:r,...d})})).json();
    if(x.err){if(x.err==='auth')out();throw x.err}return x}catch(e){if(typeof e==='string')throw e;if(i)throw'Network error'}}
const go=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e)}};
function out(){localStorage.removeItem('t');T=null;ME=null;authView()}
const sk=n=>'<div class="sk"></div>'.repeat(n);
const stars=(r,c)=>`<span style="color:#f5a623">${'★'.repeat(Math.round(r))}${'☆'.repeat(5-Math.round(r))}</span> <small>${r||'New'}${c?` (${c})`:''}</small>`;
const av=p=>`<div class="av" style="background-image:url('${esc(p||'')}')"></div>`;
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+h+'<br><button class="p" style="margin-top:10px">Close</button></div>';m.onclick=e=>{if(e.target===m||e.target.tagName=='BUTTON')m.remove()};document.body.append(m)}
const showTerms=go(async()=>modal(esc((await api('terms')).terms)));
/* AUTH */
function authView(){let mode='login';const draw=()=>{$('#app').innerHTML=`<div class="auth"><img src="logo.jpg"><h2 style="color:var(--b)">GoodNews Connect</h2>
<div class="row"><button class="${mode=='login'?'p':'s'}" id="a1">Log in</button><button class="${mode=='sign'?'p':'s'}" id="a2">Sign up</button></div>
<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password">
${mode=='sign'?`<input id="nm" placeholder="Full name"><div class="row"><input id="cd" placeholder="6-digit code" inputmode="numeric"><button class="s" id="sc">Send code</button></div>
<label style="display:block;text-align:left;margin:8px 0"><input id="ag" type="checkbox" style="width:auto"> I agree to the <a href="#" id="tc">terms and conditions</a></label>`:''}
<button class="p" style="width:100%;margin-top:8px" id="go">${mode=='login'?'Log in':'Create account'}</button></div>`;
$('#a1').onclick=()=>{mode='login';draw()};$('#a2').onclick=()=>{mode='sign';draw()};
if(mode=='sign'){$('#tc').onclick=e=>{e.preventDefault();showTerms()};$('#sc').onclick=go(async()=>{await api('sendCode',{email:$('#em').value});toast('Code sent to your email')})}
$('#go').onclick=go(async()=>{const d={email:$('#em').value,pass:$('#pw').value};
 const r=mode=='login'?await api('login',d):await api('signup',{...d,name:$('#nm').value,code:$('#cd').value,agree:$('#ag').checked});
 T=localStorage.t=r.t;boot()})};draw()}
/* SHELL */
async function boot(){if(!T)return authView();
 $('#app').innerHTML=`<header><div class="row" style="flex:none"><img src="logo.jpg"><b>GoodNews Connect</b></div><button id="lo" style="background:none;border:0;color:var(--g)">${I.out}</button></header><div id="main">${sk(4)}</div>
 <footer>${[['up','Upload'],['feed','Feed'],['msg','Messages'],['acc','Account'],['set','Settings']].map(([k,n])=>`<button data-v="${k}">${I[k]}${n}${k=='msg'?'<span class="badge" id="bd" hidden></span>':''}</button>`).join('')}</footer>`;
 $('#lo').onclick=out;document.querySelectorAll('footer button').forEach(b=>b.onclick=()=>show(b.dataset.v));
 try{const r=await api('me');ME=r.me;badge(r.unread)}catch(e){return}
 show('feed');setInterval(go(async()=>{if(T)badge((await api('me')).unread)}),30000)}
const badge=n=>{UN=n;const b=$('#bd');if(b){b.hidden=!n;b.textContent=n}};
function show(v,arg){V=v;document.querySelectorAll('footer button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
 $('#main').innerHTML='';({up:upView,feed:feedView,msg:msgView,acc:accView,set:setView,chat,prof})[v](arg)}
/* LAZY LIST */
function lazy(el,fetch,render){let p=0,more=true,busy=false;el.innerHTML='';const s=document.createElement('div');
 const load=go(async()=>{if(busy||!more)return;busy=true;s.innerHTML=sk(p?1:3);el.append(s);
  try{const r=await fetch(p++);el.insertBefore(Object.assign(document.createElement('div'),{innerHTML:r.items.map(render).join('')||(p==1?'<p class="m" style="text-align:center">Nothing found yet</p>':'')}),s);more=r.more}finally{s.innerHTML='';busy=false}
  if(more)el.append(s)});
 new IntersectionObserver(e=>e[0].isIntersecting&&load(),{rootMargin:'300px'}).observe(s);el.append(s);load()}
/* FEED */
function feedView(){let tab='listings',f={};const m=$('#main');
m.innerHTML=`<div class="card"><input id="q" placeholder="Search bricks, plumber, design..."><div class="row"><button class="s" data-t="listings">Jobs &amp; Items</button><button class="s" data-t="people">People</button><button class="s" id="ft">Filters</button></div>
<div id="fl" hidden><input id="fc" placeholder="Country"><div class="row"><input id="a1" type="number" placeholder="Age min"><input id="a2" type="number" placeholder="Age max"></div><select id="fs"><option value="">Any rating</option><option value="3">3★ &amp; up</option><option value="4">4★ &amp; up</option><option value="5">5★</option></select></div></div><div id="ls"></div>`;
const run=()=>{f={q:$('#q').value,country:$('#fc').value,amin:+$('#a1').value||0,amax:+$('#a2').value||0,stars:+$('#fs').value||0};
 m.querySelectorAll('[data-t]').forEach(b=>b.className=b.dataset.t==tab?'p':'s');
 lazy($('#ls'),p=>api(tab=='people'?'people':'feed',{...f,page:p}),tab=='people'?person:listing)};
let d;m.querySelectorAll('input,select').forEach(i=>i.oninput=()=>{clearTimeout(d);d=setTimeout(run,400)});
m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;run()});$('#ft').onclick=()=>$('#fl').hidden=!$('#fl').hidden;run()}
const listing=l=>`<div class="card"><div class="row" style="flex:none" onclick="show('prof','${l.uid}')">${av(l.by?.pic)}<div><b>${esc(l.by?.name)}</b><br>${stars(l.by?.rating||0,l.by?.rc)} <small>· ${l.by?.done||0} done</small></div></div>
<h3>${esc(l.title)}</h3><span class="tag">${esc(l.type)}</span> ${l.price?`<span class="tag">${esc(l.price)}</span>`:''} <small>${esc(l.country)}</small><p>${esc(l.desc)}</p>
<div class="row"><button class="p" onclick="claim('${l.id}',this)">${l.type=='sale'?'Buy':l.type=='job'?'Take job':'Hire'}</button><button class="s" onclick="show('chat','${l.uid}')">Message</button></div></div>`;
const claim=go(async(id,b)=>{if(!confirm('Confirm?'))return;b.disabled=true;await api('claim',{id});toast('Done! The poster was notified');b.closest('.card').remove()});
const person=p=>`<div class="card" onclick="show('prof','${p.id}')"><div class="row" style="flex:none">${av(p.pic)}<div><b>${esc(p.name)}</b> <small>${esc(p.country)}${p.age?' · '+p.age:''}</small><br>${stars(p.rating,p.rc)} <small>· ${p.done} jobs</small></div></div><p class="m">${esc((p.bio||'').slice(0,120))}</p></div>`;
const prof=go(async id=>{$('#main').innerHTML=sk(3);const r=await api('profile',{id}),p=r.p;
$('#main').innerHTML=`<button class="s" onclick="show('feed')">← Back</button><div class="card" style="text-align:center;margin-top:8px"><div class="av" style="width:90px;height:90px;margin:auto;background-image:url('${esc(p.pic)}')"></div><h3>${esc(p.name)}</h3>${stars(p.rating,p.rc)}<br><small>${p.done} jobs completed · ${esc(p.country)} ${esc(p.phone)}</small><p>${esc(p.bio)}</p>
${(p.links||'').split('\n').filter(x=>x.trim()).map(x=>`<div><a href="${esc(/^https?:/.test(x.trim())?x.trim():'#')}" target="_blank" rel="noopener nofollow">${esc(x)}</a></div>`).join('')}${p.id!=ME.id?`<button class="p" style="margin-top:8px" onclick="show('chat','${p.id}')">Message</button>`:''}</div>
<h3>Open listings</h3>${r.listings.filter(l=>l.status=='open').map(l=>listing({...l,by:p})).join('')||'<p class="m">None</p>'}<h3>Reviews</h3>${r.reviews.map(x=>`<div class="card">${stars(x.stars)}<p>${esc(x.comment)}</p></div>`).join('')||'<p class="m">No reviews yet</p>'}`});
/* UPLOAD */
function upView(){$('#main').innerHTML=`<div class="card"><h3>Post a job, service or item</h3><select id="ty"><option value="job">Job I need done</option><option value="service">Service I offer</option><option value="sale">Item for sale</option></select><input id="ti" placeholder="Title"><textarea id="de" rows="4" placeholder="Details"></textarea><input id="pr" placeholder="Price / budget"><input id="co" placeholder="Country" value="${esc(ME.country)}"><button class="p" style="width:100%" id="pb">Post</button></div>`;
$('#pb').onclick=go(async()=>{await api('newListing',{type:$('#ty').value,title:$('#ti').value,desc:$('#de').value,price:$('#pr').value,country:$('#co').value});toast('Posted!');show('feed')})}
/* MESSAGES */
function msgView(){lazy($('#main'),async()=>({...await api('threads'),more:false}),t=>`<div class="card row" onclick="show('chat','${t.id}')">${av(t.pic)}<div style="flex:3"><b>${esc(t.name)}</b> ${t.n?`<span class="badge" style="position:static">${t.n}</span>`:''}<br><small>${esc(t.last)}</small></div></div>`);badge(0)}
const chat=go(async id=>{const m=$('#main'),draw=async()=>{const r=await api('thread',{id});$('#th').innerHTML=r.items.map(x=>`<div class="msg ${x.mine?'me':''}">${esc(x.text)}</div>`).join('');scrollTo(0,1e6)};
m.innerHTML=`<button class="s" onclick="show('msg')">← Back</button><div id="th">${sk(2)}</div><div class="row" style="position:sticky;bottom:64px"><input id="mt" placeholder="Message" style="flex:4"><button class="p" id="sd">Send</button></div>`;
$('#sd').onclick=go(async()=>{const t=$('#mt').value.trim();if(!t)return;$('#mt').value='';await api('send',{to:id,text:t});draw()});await draw();
clearInterval(dp);dp=setInterval(()=>V=='chat'?draw():clearInterval(dp),10000)});
/* ACCOUNT */
async function accView(){const p=ME;$('#main').innerHTML=`<div class="card"><div class="av" id="pv" style="width:90px;height:90px;margin:auto;background-image:url('${esc(p.pic)}')"></div><input type="file" id="pf" accept="image/*"><input id="n" placeholder="Name" value="${esc(p.name)}"><input id="ph" placeholder="Phone / contact" value="${esc(p.phone)}"><div class="row"><input id="c" placeholder="Country" value="${esc(p.country)}"><input id="ag" type="number" placeholder="Age" value="${esc(p.age)}"></div><textarea id="b" rows="3" placeholder="Biography">${esc(p.bio)}</textarea><textarea id="l" rows="4" placeholder="Proof of work: one link per line (certificates, resume, images, portfolio)">${esc(p.links)}</textarea><button class="p" style="width:100%" id="sv">Save profile</button><p>${stars(p.rating,p.rc)} · ${p.done} jobs completed</p></div><h3>My listings</h3><div id="my">${sk(2)}</div>`;
let pic=p.pic;$('#pf').onchange=e=>{const i=new Image;i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,160,160);pic=c.toDataURL('image/jpeg',.7);$('#pv').style.backgroundImage=`url(${pic})`};i.src=URL.createObjectURL(e.target.files[0])};
$('#sv').onclick=go(async()=>{await api('saveProfile',{name:$('#n').value,phone:$('#ph').value,country:$('#c').value,age:$('#ag').value,bio:$('#b').value,links:$('#l').value,pic});ME=(await api('me')).me;toast('Saved')});
const r=await api('mine');$('#my').innerHTML=r.items.map(l=>`<div class="card"><b>${esc(l.title)}</b> <span class="tag">${esc(l.status)}</span>${l.status=='taken'?`<div class="row"><select id="s${l.id}">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><button class="p" onclick="done('${l.id}')">Complete &amp; rate ★</button></div>`:''}</div>`).join('')||'<p class="m">Nothing posted</p>'}
const done=go(async id=>{await api('complete',{id,stars:+$('#s'+id).value});toast('Completed');accView()});
/* SETTINGS */
function setView(){$('#main').innerHTML=`<div class="card"><label class="row"><span>Dark mode</span><input type="checkbox" id="dk" style="width:auto;flex:none" ${localStorage.d?'checked':''}></label></div><div class="card"><button class="s" id="tm">Terms &amp; Conditions</button> <button class="s" id="ib" hidden>Install app</button><p class="m" id="ih" hidden>On iPhone: tap Share, then “Add to Home Screen”.</p></div>`;
$('#dk').onchange=e=>{e.target.checked?(localStorage.d=1,document.body.dataset.d=1):(localStorage.removeItem('d'),delete document.body.dataset.d)};$('#tm').onclick=showTerms;
if(window.matchMedia('(display-mode:standalone)').matches||navigator.standalone)return;
if(/iphone|ipad/i.test(navigator.userAgent))$('#ih').hidden=false;if(window.IP){$('#ib').hidden=false;$('#ib').onclick=()=>IP.prompt()}}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.IP=e;if(V=='set')setView()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
boot();
</script></body></html>
