 <button class="p full" id="sv">Save profile</button></div><h3>My posts</h3><div id="my">${sk(2)}</div>`;
 const rp=()=>{$('#pl').innerHTML=proof.map((x,i)=>`<a ${x.t==='l'?`href="${esc(x.u)}" target="_blank"`:x.id?`href="https://drive.google.com/file/d/${x.id}/view" target="_blank"`:''}>${x.t==='l'?I.link:I.file}${esc(x.n)} <b data-k="p${i}" style="cursor:pointer;padding:0 4px">×</b></a>`).join('')+pend.map((f,i)=>`<a>${I.file}${esc(f.name)} <small>(pending)</small> <b data-k="q${i}" style="cursor:pointer;padding:0 4px">×</b></a>`).join('')||'<small class="m">Nothing added yet</small>';$('#pl').querySelectorAll('svg').forEach(s=>{s.style.width=s.style.height='16px'})};rp();
 $('#pl').onclick=e=>{const k=e.target.dataset.k;if(!k)return;e.preventDefault();(k[0]==='p'?proof:pend).splice(+k.slice(1),1);rp()};
 $('#la').onclick=()=>{let u=$('#lk').value.trim();if(!u)return;if(!/^https?:/i.test(u))u='https://'+u;proof.push({t:'l',n:u.replace(/^https?:\/\//,'').slice(0,40),u});$('#lk').value='';rp()};
 $('#fa').onclick=async()=>{pend=pend.concat(await pick('',true));rp()};$('#pp2').onclick=async()=>{const [f]=await pick('image/*');if(f){picF=f;$('#pv').innerHTML=`<div class="av" style="width:84px;height:84px;background-image:url('${URL.createObjectURL(f)}')"></div>`}};
 $('#db').oninput=()=>$('#ag').textContent=calcAge($('#db').value)?'· '+calcAge($('#db').value)+' years old':'';
 $('#sv').onclick=W('Saving your profile',async b=>{const fl=(picF?[picF]:[]).concat(pend),up=fl.length?await upFiles(fl,b,0,85,picF?900:1400):[];let pic=p.pic;if(picF)pic=up.shift().id;
  await api('saveProfile',{name:$('#n').value,phone:$('#ph').value,dob:$('#db').value,country:$('#c').value,location:$('#lc').value,profession:$('#pf').value,bio:$('#b').value,pic,proof:proof.concat(up)});b.set(95);await refreshMe();LS('c_ppl',null);toast('Profile saved');accView()});
 try{const r=await api('mine');$('#my').innerHTML=r.items.map(l=>`<div class="card"><div class="row"><div style="flex:3"><b>${esc(l.title)}</b><div><span class="tag">${LAB[l.type]}</span> <span class="tag">${l.status==='open'?'Open':l.status==='taken'?'In progress':l.status==='sold'?'Sold':'Completed'}</span></div></div></div>
  <div class="ac">${l.status==='open'?`<button class="p" onclick="reqsSheet('${l.id}')">Requests (${l.reqs})</button>`:l.status==='taken'?`<button class="p" onclick="rateSheet('${l.id}')">Complete &amp; rate</button><button class="s" onclick="reqsSheet('${l.id}')">View</button>`:''}</div></div>`).join('')||'<div class="emp">You have not posted anything yet</div>'}catch(e){toast(e)}}
async function reqsSheet(id){const s=sheet(sk(2));try{const r=await api('requests',{id});
 s.firstChild.innerHTML=`<h3>Requests</h3>${r.items.map(q=>`<div class="card"><div class="pc2" onclick="this.closest('.modal').remove();nav('prof','${q.p.id}')">${av(q.p.pic,46)}<div class="pi"><b>${esc(q.p.name)}</b><small>${esc(q.p.profession||'')} · ${esc(q.p.country||'')}</small><div>${stars(q.p.rating,q.p.rc)} <small style="display:inline">· ${q.p.done} jobs</small></div></div></div>${q.note?`<p class="ds">${esc(q.note)}</p>`:''}
 <div class="ac"><button class="s" onclick="this.closest('.modal').remove();nav('chat','${q.p.id}')">Chat</button>${r.status==='open'&&q.status==='pending'?`<button class="p" data-d="1" data-i="${q.id}">Accept</button><button class="s" data-d="0" data-i="${q.id}">Decline</button>`:`<span class="tag" style="align-self:center">${q.status}</span>`}</div></div>`).join('')||'<div class="emp">No requests yet</div>'}`;
 s.onclick=async e=>{if(e.target===s)return s.remove();const b=e.target.closest('[data-d]');if(!b)return;const ok=b.dataset.d==='1';if(ok&&!confirm('Accept this person? Other requests will be declined and the post will close.'))return;
  await W(ok?'Accepting request':'Declining',async()=>{await api('decide',{rid:b.dataset.i,ok});LS('c_feed',null);s.remove();toast(ok?'Accepted. They were notified.':'Declined');accView()})()}}catch(e){s.remove();toast(e)}}
function rateSheet(id){const s=sheet(`<h3>Complete job &amp; rate</h3><select id="st">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)} (${n})</option>`).join('')}</select><textarea id="cm" rows="3" placeholder="How did it go? (optional)"></textarea><button class="p full" id="rk2">Submit</button>`);
 $('#rk2').onclick=W('Saving rating',async()=>{await api('complete',{id,stars:+$('#st').value,comment:$('#cm').value});s.remove();toast('Job completed. Rating saved.');accView()})}
/* SETTINGS + INSTALL */
let IP;const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone,ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;setTimeout(()=>installAsk(),900)});
function installAsk(force){if(standalone()||$('#ins'))return;if(!force&&(!(IP||ios)||(LS('ia')||0)>Date.now()-2592e5))return;
 const s=sheet(`<div id="ins" style="text-align:center"><img src="logo.jpg" style="width:72px;border-radius:18px"><h3>Install GoodNews Connect</h3><p class="m">Add it to your home screen for a faster, full-screen app experience.</p>
 ${IP?'<button class="p full" id="ib">Install app</button>':ios?'<p style="text-align:left">1. Tap the <b>Share</b> button in Safari<br>2. Choose <b>Add to Home Screen</b><br>3. Tap <b>Add</b></p>':'<p style="text-align:left">Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.</p>'}<button class="s full" id="ix">Not now</button></div>`);
 if($('#ib'))$('#ib').onclick=async()=>{s.remove();IP.prompt();await IP.userChoice;IP=null};$('#ix').onclick=()=>{LS('ia',Date.now());s.remove()}}
function setView(){$('#main').innerHTML=`<h2>Settings</h2><div class="card"><label class="row"><span>Dark mode</span><input type="checkbox" id="dk" style="width:auto;flex:none" ${localStorage.d?'checked':''}></label></div>
 <div class="card"><button class="s full" id="im">Install app</button><button class="s full" id="tm">Terms &amp; Conditions</button><button class="s full" id="lg" style="color:#c62828">Log out</button></div>`;
 $('#dk').onchange=e=>{e.target.checked?(localStorage.d=1,document.body.dataset.d=1):(localStorage.removeItem('d'),delete document.body.dataset.d)};$('#tm').onclick=terms;$('#im').onclick=()=>standalone()?toast('Already installed'):installAsk(1);$('#lg').onclick=()=>confirm('Log out?')&&out()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
if(!T)authView();else{boot()}
if(!T)setTimeout(()=>installAsk(),1800);
</script></body></html>
